name: yijintool
services:
  ocr-models:
    image: yijintool-ocr:0.2.0-beta.1
    build:
      context: ./services/ocr
    command: ['python', 'models.py']
    volumes:
      - ocr-model-data:/models
    restart: 'no'
  ocr:
    image: yijintool-ocr:0.2.0-beta.1
    build:
      context: ./services/ocr
    environment:
      BOS_OCR_TOKEN: ${BOS_OCR_TOKEN:?BOS_OCR_TOKEN_REQUIRED}
    depends_on:
      ocr-models:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ocr-model-data:/models:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 3g
    cpus: 4
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)',
        ]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 30s
    stop_grace_period: 30s
  postgres:
    image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    environment:
      POSTGRES_DB: business_dev
      POSTGRES_USER: business_dev
      POSTGRES_PASSWORD: ${BOS_DB_PASSWORD:?BOS_DB_PASSWORD_REQUIRED}
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:54321:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U business_dev -d business_dev']
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s
  postgres-test:
    image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    profiles: ['test']
    environment:
      POSTGRES_DB: business_test
      POSTGRES_USER: business_test
      POSTGRES_PASSWORD: ${BOS_TEST_DB_PASSWORD:?BOS_TEST_DB_PASSWORD_REQUIRED}
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:54322:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U business_test -d business_test']
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s
volumes:
  ocr-model-data:
  postgres-data:
  postgres-test-data:
